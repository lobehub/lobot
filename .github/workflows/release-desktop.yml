name: Release Desktop

# ============================================
# Lobot 桌面端发布
# ============================================
# v* tag（Auto Release 打的或手动推的）触发。先比较 HEAD 与 <channel>/shell.json
# 的 shellAbi：
#   - 外壳未变 → 只发 core 增量包（OTA，调用 release-desktop-core-ota.yml），
#     版本为 <上次整包版本>-core.<seq>，不建 GitHub Release
#   - 外壳有变 / 还没有整包 / 未配置 OTA 密钥或更新源 → 构建三端安装包，发到本仓
#     Release，并同步到 S3 更新源
# 手动 dispatch 选 mode=full 可强制发整包。
#
# 可选配置（缺失时对应步骤降级而不失败）：
#   - APPLE_*：macOS 签名与公证，缺失则产物未签名
#   - MAC_PROVISIONING_PROFILE_BASE64：授权 com.lobehub.lobot 通讯通知（Communication
#     Notifications）权限的 provisioning profile，需同时配 APPLE_TEAM_ID。缺失则系统通知不显示
#     发送者头像，只显示 App 图标。
#   - UPDATE_SERVER_URL：客户端检查更新的地址
#   - UPDATE_AWS_* / UPDATE_S3_*：S3 更新源，缺失则跳过同步
#   - RENDERER_OTA_PUBLIC_KEY / RENDERER_OTA_PRIVATE_KEY：增量更新（Core OTA）签名密钥对。
#     公钥编进外壳；私钥给 r0 core 签名。缺失则本版不能接收增量更新。
#   - SPARKLE_ED_PUBLIC_KEY / SPARKLE_ED_PRIVATE_KEY：macOS 整包走 Sparkle（含 delta）的 EdDSA
#     密钥对。公钥编进 Info.plist；私钥签 appcast。未配置时复用 RENDERER_OTA_* 这对 Ed25519
#     密钥（scripts/sparkleKeys.mjs 转换格式）；两对都缺失则 macOS 用 electron-updater。
#     公钥不计入 shellAbi，更换后要用 mode=full 发一次整包。
# ============================================

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.1.0)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options: [stable, beta, canary]
        default: stable
      mode:
        description: 'auto：外壳未变时只发 core（OTA），否则发整包；full：强制发整包'
        required: false
        type: choice
        options: [auto, full]
        default: auto
      draft:
        description: '发布为 draft release（gh 对 draft 的 tag 绑定不稳定，默认直接发布）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一频道的发布排队执行：OTA 判断读的是上一次整包写入的 shell.json，并行会读到旧值。
# 排队中的旧 tag 会被更新的 tag 取代，它的改动随新 tag 一起发出。
concurrency:
  group: release-desktop-${{ inputs.channel || 'stable' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  npm_config_registry: https://registry.npmjs.org

jobs:
  # ---------- 1. 解析版本，决定发整包还是 OTA ----------
  prepare:
    name: Resolve version and mode
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      channel: ${{ steps.resolve.outputs.channel }}
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - name: Resolve
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          CHANNEL="${{ inputs.channel }}"
          if [ -z "$CHANNEL" ]; then CHANNEL="stable"; fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "Building Lobot ${VERSION} (${CHANNEL})"

      - uses: actions/checkout@v7

      - name: Gate on shellAbi
        id: gate
        if: inputs.mode != 'full'
        uses: ./.github/actions/desktop-shell-gate
        with:
          channel: ${{ steps.resolve.outputs.channel }}
          update-server-url: ${{ secrets.UPDATE_SERVER_URL }}
          public-key: ${{ secrets.RENDERER_OTA_PUBLIC_KEY }}

      - name: Decide mode
        id: mode
        shell: bash
        env:
          FORCE_FULL: ${{ inputs.mode == 'full' }}
          REQUIRES_FULL: ${{ steps.gate.outputs.requires-full-release }}
          HAS_PRIVATE_KEY: ${{ secrets.RENDERER_OTA_PRIVATE_KEY != '' }}
          SHIPPED_VERSION: ${{ steps.gate.outputs.app-version }}
        run: |
          set -euo pipefail
          if [ "$FORCE_FULL" = "true" ]; then
            MODE=full REASON="手动指定 mode=full"
          elif [ "$HAS_PRIVATE_KEY" != "true" ]; then
            MODE=full REASON="未配置 RENDERER_OTA_PRIVATE_KEY，无法签名 core"
          elif [ "$REQUIRES_FULL" != "false" ]; then
            MODE=full REASON="外壳自上次整包后有变化（或还没有整包）"
          else
            MODE=ota REASON="外壳与 ${SHIPPED_VERSION} 一致，只发 core"
          fi
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "Mode: ${MODE}（${REASON}）"
          echo "### Release mode: \`${MODE}\`（${REASON}）" >> "$GITHUB_STEP_SUMMARY"

  # ---------- 1b. OTA：外壳未变，只发 core ----------
  core-ota:
    name: Core OTA
    needs: prepare
    if: needs.prepare.outputs.mode == 'ota'
    uses: ./.github/workflows/release-desktop-core-ota.yml
    with:
      channel: ${{ needs.prepare.outputs.channel }}
    secrets: inherit

  # ---------- 2. 构建 ----------
  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    if: needs.prepare.outputs.mode == 'full'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            platform: mac
            arch: arm64
            artifact: mac-arm64
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
            artifact: win-x64
          - name: Linux x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            artifact: linux-x64

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        # Version comes from package.json `packageManager`.
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # v5+ caches by `packageManager` on its own; these builds stay uncached.
          package-manager-cache: false
          node-version: ${{ env.NODE_VERSION }}

      # apps/cli builds with bun (ensureWorkspaceLinks + tsdown).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        shell: bash
        run: pnpm install

      - name: Set version
        shell: bash
        run: npm run workflow:set-desktop-version ${{ needs.prepare.outputs.version }} ${{ needs.prepare.outputs.channel }}

      - name: Build app bundle
        shell: bash
        env:
          # vite.main.config.ts 把这两个值编译进主进程；缺失时客户端不知道去哪检查更新。
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          RENDERER_OTA_PUBLIC_KEY: ${{ secrets.RENDERER_OTA_PUBLIC_KEY }}
        run: pnpm build:main

      # 通讯通知权限必须与授权它的 profile 一起签进包，否则 macOS 拒绝启动；
      # electron-builder.mjs 只在 MAC_PROVISIONING_PROFILE 存在时加上该权限。
      - name: Prepare macOS provisioning profile
        if: matrix.platform == 'mac'
        shell: bash
        env:
          MAC_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$MAC_PROVISIONING_PROFILE_BASE64" ]; then
            printf '%s' "$MAC_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/lobot.provisionprofile"
            echo "MAC_PROVISIONING_PROFILE=$RUNNER_TEMP/lobot.provisionprofile" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 MAC_PROVISIONING_PROFILE_BASE64，系统通知不显示发送者头像"
          fi

      - name: Package
        shell: bash
        env:
          UPDATE_CHANNEL: ${{ needs.prepare.outputs.channel }}
          # 用 APP_UPDATE_SERVER_URL 而不是 UPDATE_SERVER_URL：前者只让 afterPack 改写
          # app-update.yml 指向 S3，后者会把 provider 变成 generic 从而不再生成 latest*.yml。
          APP_UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          # beforePack 把公钥写进 shell/abi.json，并参与计算 shellAbi；增量发布按 shellAbi 判断能否复用本版外壳。
          RENDERER_OTA_PUBLIC_KEY: ${{ secrets.RENDERER_OTA_PUBLIC_KEY }}
          # macOS 有它时打入 Sparkle.framework，appcast 地址取自 APP_UPDATE_SERVER_URL。
          # 与 publish-sparkle 的私钥同一来源：配了 SPARKLE_ED_PUBLIC_KEY 用 Sparkle 专用对，否则用 OTA 对。
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY || secrets.RENDERER_OTA_PUBLIC_KEY }}
          # electron-builder.mjs 以 CSC_LINK 是否存在决定是否签名；
          # 证书缺失时构建仍可完成，只是产物未签名。
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            mac)
              if [ -n "${CSC_LINK:-}" ]; then
                echo "🔐 使用 Developer ID 证书签名并公证"
                npx electron-builder --mac --${{ matrix.arch }} --config electron-builder.mjs \
                  --publish never -c.npmRebuild=false
              else
                echo "::warning::未配置 APPLE_CERTIFICATE_BASE64，产物未签名、未公证"
                npx electron-builder --mac --${{ matrix.arch }} --config electron-builder.mjs \
                  --publish never -c.npmRebuild=false -c.mac.identity=null -c.mac.notarize=false
              fi
              ;;

            win)
              npx electron-builder --win --${{ matrix.arch }} --config electron-builder.mjs --publish never -c.npmRebuild=false
              ;;
            linux)
              npx electron-builder --linux --${{ matrix.arch }} --config electron-builder.mjs --publish never -c.npmRebuild=false
              ;;
          esac

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7

      # r0 core：本版内置 core 的签名快照，是之后增量包的基线（release-desktop-core-ota.yml）。
      - name: Build r0 core release
        id: core
        shell: bash
        env:
          RENDERER_OTA_PRIVATE_KEY: ${{ secrets.RENDERER_OTA_PRIVATE_KEY }}
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RENDERER_OTA_PRIVATE_KEY:-}" ] || [ -z "${UPDATE_SERVER_URL:-}" ]; then
            echo "::warning::未配置 RENDERER_OTA_PRIVATE_KEY / UPDATE_SERVER_URL，跳过 r0 core，本版不能接收增量更新"
            exit 0
          fi
          BASE="${UPDATE_SERVER_URL%/}"
          case "$BASE" in */stable|*/nightly|*/canary|*/beta) BASE="${BASE%/*}" ;; esac
          case "$BASE" in http://*|https://*) ;; *) BASE="https://$BASE" ;; esac
          read -r PLATFORM CHANNEL VERSION SEQ SHELL_ABI < <(node -p "const m=require('./core-dist/manifest.json');[m.platform,m.channel,m.version,m.seq,m.shellAbi].join(' ')")
          node scripts/buildCore.mjs --protocol=4 \
            --core=core-dist \
            --platform="$PLATFORM" \
            --channel="$CHANNEL" \
            --version="$VERSION" \
            --seq="$SEQ" \
            --shell-abi="$SHELL_ABI" \
            --objects-base-url="$BASE/cas" \
            --out=release/core-ota
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"

      - name: Upload r0 core release
        if: steps.core.outputs.platform != ''
        uses: actions/upload-artifact@v7
        with:
          name: core-r0-${{ steps.core.outputs.platform }}
          path: release/core-ota
          retention-days: 7

  # ---------- 3. 发布到本仓（公开）----------
  release:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      # Releases are created with the org's LobeHub bot GitHub App token, the same chain the
      # lobehub repo uses: the workflow GITHUB_TOKEN started getting HTTP 403 on
      # `POST /releases` (2026-11-15) even with `contents: write`.
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.LOBEHUB_BOT_APP_ID }}
          private-key: ${{ secrets.LOBEHUB_BOT_APP_PRIVATE_KEY }}

      # gh release resolves the target repo from the git remote. The checkout keeps the default
      # GITHUB_TOKEN on purpose: a tag it pushes then does not re-trigger this workflow's
      # `push: tags` run, which an App-token push would.
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create / update release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Resolve from job outputs, then the dispatch input, then the tag ref.
          VERSION="${{ needs.prepare.outputs.version }}"
          [ -n "$VERSION" ] || VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="${GITHUB_REF_NAME#v}"
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"
          DRAFT="${{ inputs.draft }}"
          DRAFT_FLAG=""
          # tag push 没有 inputs，和 dispatch 的默认值一样直接发布。
          if [ "$DRAFT" = "true" ]; then DRAFT_FLAG="--draft"; fi

          echo "Publishing ${TAG} to ${REPO}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，追加产物"
          else
            # A draft release created for a missing tag becomes "untagged", and
            # GitHub refuses asset uploads to untagged releases. Create the tag
            # first so the draft is bound to it.
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "$TAG" || true

            gh release create "$TAG" \
              --repo "$REPO" \
              --target "$GITHUB_SHA" \
              --title "Lobot ${VERSION}" \
              --notes "Lobot ${VERSION} (${{ needs.prepare.outputs.channel }})" \
              $DRAFT_FLAG
          fi

          # Uploads can 404 for a few seconds right after the release is created
          # (read-after-write lag), so retry each asset a few times.
          while IFS= read -r -d '' file; do
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$file" --repo "$REPO" --clobber; then
                break
              fi
              echo "上传失败 (第 ${attempt} 次): ${file}"
              sleep 6
              [ "$attempt" = 5 ] && { echo "::error::上传失败: ${file}"; exit 1; }
            done
          done < <(find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name 'latest*.yml' \) -print0)

      # 客户端按 UPDATE_SERVER_URL 从 S3 检查更新；GitHub Release 作为备份。
      - name: Sync artifacts to S3
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.UPDATE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.UPDATE_S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.UPDATE_S3_ENDPOINT }}
          S3_REGION: ${{ secrets.UPDATE_S3_REGION || 'us-east-1' }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
        run: |
          set -euo pipefail
          if [ -z "${S3_BUCKET:-}" ]; then
            echo "::warning::UPDATE_S3_BUCKET 未配置，跳过 S3 同步"
            exit 0
          fi

          AWS_ARGS=(--region "$S3_REGION")
          if [ -n "${S3_ENDPOINT:-}" ]; then AWS_ARGS+=(--endpoint-url "$S3_ENDPOINT"); fi

          # 客户端只认 stable / canary（beta 并入 canary，见 modules/updater/configs.ts）。
          case "$CHANNEL" in
            canary | beta) FEED_CHANNEL=canary ;;
            *) FEED_CHANNEL=stable ;;
          esac

          upload() {
            aws s3 cp "$1" "s3://${S3_BUCKET}/${FEED_CHANNEL}/$2" "${AWS_ARGS[@]}" \
              --cache-control 'public, max-age=300'
            echo "⬆️  ${FEED_CHANNEL}/$2"
            count=$((count + 1))
          }

          count=0
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            upload "$file" "$name"
            # electron-updater 设置 channel 后读取 {channel}*.yml（如 stable-mac.yml），
            # 而 GitHub provider 生成的是 latest*.yml，两份都传。
            case "$name" in
              latest*.yml) upload "$file" "${FEED_CHANNEL}${name#latest}" ;;
            esac
          done < <(find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.tar.gz' -o -name 'latest*.yml' \) -print0)

          echo "✅ 已同步 ${count} 个文件到 s3://${S3_BUCKET}/${FEED_CHANNEL}/"

      # shell.json 记录本版外壳的 shellAbi，增量发布据此判断能否只发 core。
      - name: Compose shell.json and r0 core
        id: shell
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release/core-ota
          SHELL_ABI=""
          for latest in dist/core-r0-*/core-v4/*/latest.json; do
            [ -f "$latest" ] || continue
            platform=$(basename "$(dirname "$latest")")
            [ "$(jq -r '.version' "$latest")" = "$VERSION" ] || { echo "::error::core version in $latest is not $VERSION"; exit 1; }
            abi=$(jq -er '.shellAbi' "$latest")
            [ -z "$SHELL_ABI" ] && SHELL_ABI="$abi"
            [ "$abi" = "$SHELL_ABI" ] || { echo "::error::shellAbi differs across platforms ($latest)"; exit 1; }
            mkdir -p release/core-ota/core-v4
            cp -R "$(dirname "$latest")" release/core-ota/core-v4/
          done
          if [ -z "$SHELL_ABI" ]; then
            echo "::warning::没有 r0 core 产物，跳过 shell.json"
            exit 0
          fi
          jq -n --arg shellAbi "$SHELL_ABI" --arg shellVersion "$VERSION" --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{shellAbi: $shellAbi, shellVersion: $shellVersion, publishedAt: $publishedAt}' > release/shell.json
          cat release/shell.json
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Publish shell.json and r0 core
        if: steps.shell.outputs.ready == 'true'
        uses: ./.github/actions/desktop-publish-core-ota
        with:
          core-dir: core-v4
          app-version: ${{ needs.prepare.outputs.version }}
          channel: ${{ needs.prepare.outputs.channel }}
          release-dir: release/core-ota
          shell-json: release/shell.json
          aws-access-key-id: ${{ secrets.UPDATE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.UPDATE_AWS_SECRET_ACCESS_KEY }}
          s3-bucket: ${{ secrets.UPDATE_S3_BUCKET }}
          s3-region: ${{ secrets.UPDATE_S3_REGION || 'us-east-1' }}
          s3-endpoint: ${{ secrets.UPDATE_S3_ENDPOINT }}

  # ---------- 4. macOS Sparkle appcast ----------
  # generate_appcast / sign_update 只有 macOS 版，签名私钥只落在 RAM disk 上。
  publish-sparkle:
    name: Publish Sparkle appcast
    needs: [prepare, release]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          package-manager-cache: false
          node-version: ${{ env.NODE_VERSION }}

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: mac-arm64
          path: release

      # 与 S3 同步一致：客户端只认 stable / canary（beta 并入 canary）。
      - name: Resolve feed channel
        id: feed
        shell: bash
        run: |
          case "${{ needs.prepare.outputs.channel }}" in
            canary | beta) echo "channel=canary" >> "$GITHUB_OUTPUT" ;;
            *) echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: ./.github/actions/desktop-publish-sparkle
        with:
          channel: ${{ steps.feed.outputs.channel }}
          version: ${{ needs.prepare.outputs.version }}
          release-dir: release
          server-url: ${{ secrets.UPDATE_SERVER_URL }}
          # 公私钥成对选取，避免 Sparkle 公钥配上 OTA 私钥；action 还会校验两者匹配。
          ed-public-key: ${{ secrets.SPARKLE_ED_PUBLIC_KEY || secrets.RENDERER_OTA_PUBLIC_KEY }}
          ed-private-key: ${{ (secrets.SPARKLE_ED_PUBLIC_KEY && secrets.SPARKLE_ED_PRIVATE_KEY) || (!secrets.SPARKLE_ED_PUBLIC_KEY && secrets.RENDERER_OTA_PRIVATE_KEY) || '' }}
          aws-access-key-id: ${{ secrets.UPDATE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.UPDATE_AWS_SECRET_ACCESS_KEY }}
          s3-bucket: ${{ secrets.UPDATE_S3_BUCKET }}
          s3-region: ${{ secrets.UPDATE_S3_REGION || 'us-east-1' }}
          s3-endpoint: ${{ secrets.UPDATE_S3_ENDPOINT }}
