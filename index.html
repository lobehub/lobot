<!doctype html>
<html class="desktop">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: inherit;
        gap: 12px;
      }
      /* The window is frameless, so the titlebar band is only draggable through CSS. This
         screen is the whole window until React mounts, which left the titlebar dead for the
         first paint. Height matches TITLE_BAR_HEIGHT in @lobechat/desktop-bridge. */
      #loading-drag-bar {
        position: fixed;
        inset: 0 0 auto;
        height: 38px;
        -webkit-app-region: drag;
      }
      @keyframes loading-draw {
        0% {
          stroke-dashoffset: 1000;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }
      @keyframes loading-fill {
        30% {
          fill-opacity: 0.05;
        }
        100% {
          fill-opacity: 1;
        }
      }
      #loading-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #1f1f1f;
      }
      #loading-brand svg path {
        fill: currentcolor;
        fill-opacity: 0;
        stroke: currentcolor;
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        stroke-width: 0.25em;
        animation:
          loading-draw 2s cubic-bezier(0.4, 0, 0.2, 1) infinite,
          loading-fill 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      html[data-theme='dark'] #loading-brand {
        color: #f0f0f0;
      }
    </style>
  </head>
  <body style="height: 100%">
    <script>
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('theme') || 'system';
        } catch (_) {}
        var systemTheme =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        var resolvedTheme = theme === 'system' ? systemTheme : theme;
        if (resolvedTheme === 'dark' || resolvedTheme === 'light') {
          document.documentElement.setAttribute('data-theme', resolvedTheme);
        }
        // The main process resolves `lng` from the stored setting, or from the OS
        // language when that setting is `auto`, so it always wins. The i18next
        // cache is only a fallback for renderer-side reloads (Cmd+R) that landed
        // on a client-routed URL without the query param. `navigator.language`
        // is last — packaging prunes the app's locales, which makes it report
        // English on a non-English system.
        var urlParams = new URLSearchParams(window.location.search);
        var locale = urlParams.get('lng');
        if (!locale) {
          try {
            locale = localStorage.getItem('i18nextLng');
          } catch (_) {}
        }
        if (!locale) locale = navigator.language || 'en-US';
        document.documentElement.lang = locale;
        var rtl = ['ar', 'arc', 'dv', 'fa', 'ha', 'he', 'khw', 'ks', 'ku', 'ps', 'ur', 'yi'];
        document.documentElement.dir =
          rtl.indexOf(locale.split('-')[0].toLowerCase()) >= 0 ? 'rtl' : 'ltr';
      })();
    </script>
